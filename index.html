<script>
const CATS = ['Itens de venda', 'Especiais', 'Porções', 'Extras', 'Preparos base'];
const TIPOS_ESP = ['Lanche', 'Pizza'];
const UN = { Gramas: 'g', Grama: 'g', Litros: 'L', Litro: 'L', Unidade: 'un', Unidades: 'un', Quilos: 'kg', Quilo: 'kg', Quilogramas: 'kg', Quilograma: 'kg', Miligramas: 'mg', Mililitros: 'ml', Mililitro: 'ml', ML: 'ml' };
const TIPOS = {
  'Sem preço': 'Insumo cadastrado sem preço. O custo dele não entra na ficha.',
  'Sem quantidade': 'O ingrediente está na ficha, mas sem quantidade, então custa R$ 0,00.',
  'Sem ingrediente': 'A linha tem quantidade, mas o nome do ingrediente está vazio.',
  'Fora do cadastro': 'O nome não existe na aba Insumos, então o custo não entra na ficha.',
  'Custo zero': 'Tem quantidade, mas o custo calculado é R$ 0,00.',
  'Sem margem': 'Item de venda sem margem, por isso fica sem preço sugerido.',
  'Insumo sem preço': 'Sem preço na aba Insumos: toda ficha que usa esse insumo fica sem o custo dele.',
  'Insumo sem uso': 'Está cadastrado, mas não aparece em nenhuma ficha.'
};
const INFO = new Set(['Insumo sem uso']);
const CATS_DEL = ['Itens de venda', 'Porções'];
const temCompar = f => !!f && CATS_DEL.includes(f.categoria);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').trim().toLowerCase();
const semAcento = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const nf = (a, b) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: a, maximumFractionDigits: b ?? a });
const brl = v => v == null ? '—' : 'R$ ' + nf(2).format(v);
const brlU = v => v == null ? '—' : 'R$ ' + (Math.abs(v) < 1 ? nf(4) : nf(2)).format(v);
const numTxt = v => v == null ? '' : nf(0, 6).format(v).replace(/\./g, '');
const pctTxt = v => v == null ? '' : nf(0, 2).format(v * 100);
function parseNum(txt) {

function calcular(c) {

    const k = norm(it.nome); if (!k) continue;
    if (!usos.has(k)) usos.set(k, new Set());

}

      <div class="tbl"><table><thead><tr><th>Pessoa</th><th>Acesso</th><th></th></tr></thead><tbody>
      ${(gente || []).map(g => `<tr><td>${h(g.email)}${g.user_id === eu ? ' <span class="muted">(você)</span>' : ''}</td>
        <td>${dono ? `<select data-eq-papel="${h(g.user_id)}" aria-label="Acesso de ${h(g.email)}">${Object.entries(PAPEIS).map(([k, v]) => `<option value="${k}"${k === g.papel ? ' selected' : ''}>${v}</option>`).join('')}</select>` : h(PAPEIS[g.papel])}</td>
        <td>${dono && g.user_id !== eu ? `<button class="ghost danger" data-eq-tirar="${h(g.user_id)}">Tirar</button>` : g.user_id === eu && !dono ? `<button class="ghost danger" data-eq-tirar="${h(g.user_id)}">Sair do restaurante</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="muted"><b>Dono</b>: tudo, inclusive a equipe. <b>Editor</b>: cria e altera fichas, insumos, receitas e perdas. <b>Só visualiza</b>: consulta sem alterar.</p>
      <p class="ent-msg" id="eq-msg" role="status" hidden></p></div>`;
  }
  const eqMsg = t => { const el = $e('eq-msg'); if (el) { el.hidden = !t; el.textContent = t || ''; } };

  /* ---- eventos ---- */
  document.addEventListener('submit', async e => {
    const f = e.target.closest('[data-form]'); if (!f) return;
    e.preventDefault(); if (OCUPADO) return;
    const v = Object.fromEntries(new FormData(f).entries()), tipo = f.dataset.form;
    OCUPADO = true; MSG = '';
    try {
      if (tipo === 'login') { const { error } = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.senha }); if (error) throw error; }
      else if (tipo === 'cadastro') {
        const { data, error } = await sb.auth.signUp({ email: v.email.trim(), password: v.senha });
        if (error) throw error;
        if (!data.session) { const r = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.senha }); if (r.error) throw r.error; }
      }
      else if (tipo === 'esqueci') { const { error } = await sb.auth.resetPasswordForEmail(v.email.trim(), { redirectTo: location.origin + location.pathname }); if (error) throw error; MSG = 'Pronto. Abra o link que chegou no seu e-mail.'; ENTRADA = 'login'; OCUPADO = false; telaLogin(); return; }
      else if (tipo === 'novasenha') { const { error } = await sb.auth.updateUser({ password: v.senha }); if (error) throw error; RECUPERAR = false; history.replaceState(null, '', location.pathname); OCUPADO = false; await depoisDeEntrar(); return; }
      else if (tipo === 'criar') { const { data, error } = await sb.rpc('criar_restaurante', { p_nome: v.nome }); if (error) throw error; OCUPADO = false; return abrirRestaurante(data); }
      else if (tipo === 'codigo') { const { data, error } = await sb.rpc('entrar_com_codigo', { p_codigo: v.codigo }); if (error) throw error; OCUPADO = false; return abrirRestaurante(data); }
      else if (tipo === 'renomear') { const nome = v.nome.trim(); const { error } = await sb.from('restaurantes').update({ nome }).eq('id', RID); if (error) throw error; NOME = nome; document.querySelector('header.top h1').textContent = nome; document.title = nome + ' · Fichas Técnicas'; eqMsg('Nome salvo.'); OCUPADO = false; return; }
    } catch (err) {
      OCUPADO = false;
      if (tipo === 'renomear') { eqMsg(traduz(err)); return; }
      MSG = traduz(err); SESS && !RECUPERAR ? telaRestaurantes() : telaLogin(); return;
    }
    OCUPADO = false;
  });
  document.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (d.ent) { e.preventDefault(); ENTRADA = d.ent; MSG = ''; telaLogin(); return; }
    if (d.abrir) { abrirRestaurante(d.abrir); return; }
    if (d.sair !== undefined) { await sb.auth.signOut(); lsSet(null); location.reload(); return; }
    if (d.trocar !== undefined) { lsSet(null); location.reload(); return; }
    if (d.equipe !== undefined) { painelEquipe(); return; }
    if (d.eqFechar !== undefined) { $e('equipe').hidden = true; $e('equipe').innerHTML = ''; return; }
    if (d.eqCopiar !== undefined) {
      const txt = `Entre em ${location.origin + location.pathname}, crie sua conta e use o código de convite ${$e('eq-codigo').textContent} para entrar em ${NOME}.`;
      try { await navigator.clipboard.writeText(txt); eqMsg('Convite copiado. Cole no WhatsApp para mandar.'); } catch (err) { eqMsg(txt); }
      return;
    }
    if (d.eqNovo !== undefined) { const { data, error } = await sb.rpc('novo_codigo', { p_rid: RID }); if (error) return eqMsg(traduz(error)); $e('eq-codigo').textContent = data; eqMsg('Código trocado. O antigo não funciona mais.'); return; }
    if (d.eqTirar) {
      if (t.dataset.certeza !== '1') { t.dataset.certeza = '1'; t.textContent = 'Confirmar'; return; }
      const { error } = await sb.rpc('remover_membro', { p_rid: RID, p_user: d.eqTirar });
      if (error) return eqMsg(traduz(error));
      if (d.eqTirar === SESS.user.id) { lsSet(null); location.reload(); return; }
      painelEquipe(); return;
    }
  });
  document.addEventListener('change', async e => {
    const s = e.target; if (!s.dataset || !s.dataset.eqPapel) return;
    const { error } = await sb.rpc('mudar_papel', { p_rid: RID, p_user: s.dataset.eqPapel, p_papel: s.value });
    if (error) { eqMsg(traduz(error)); painelEquipe(); return; }
    if (s.dataset.eqPapel === SESS.user.id) { location.reload(); return; }
    eqMsg('Acesso alterado.');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$e('equipe').hidden) { $e('equipe').hidden = true; $e('equipe').innerHTML = ''; } });

  /* ---- início ---- */
  async function depoisDeEntrar() {
    const salvo = lsGet();
    if (salvo) return abrirRestaurante(salvo);
    return telaRestaurantes();
  }
  let comecou = false;
  sb.auth.onAuthStateChange((ev, sess) => {
    SESS = sess;
    if (ev === 'PASSWORD_RECOVERY') { RECUPERAR = true; telaLogin(); return; }
    if (ev === 'SIGNED_IN' && !comecou && !RECUPERAR) { comecou = true; setTimeout(depoisDeEntrar, 0); }
  });
  (async () => {
    const { data } = await sb.auth.getSession();
    SESS = data.session;
    if (RECUPERAR) return;
    if (SESS) { if (!comecou) { comecou = true; depoisDeEntrar(); } }
    else telaLogin();
  })();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

</body></html>
